appId: dev.opensqltools.app
productName: Open SQL Tools
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
# Next to the executable, beside Electron's LICENSE.electron.txt and LICENSES.chromium.html.
extraFiles:
  - from: LICENSE
    to: LICENSE.txt
  - from: out/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
# Releases are drafts on GitHub; electron-updater reads latest.yml from the published ones.
publish:
  provider: github
  owner: maickonn
  repo: Open-SQL-Tools
  releaseType: draft
asarUnpack:
  - '**/node_modules/cpu-features/**'
win:
  target: [nsis]
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# Apple Silicon only, without a Developer ID: no signing here (identity null), the bundle is signed
# ad hoc after packing (scripts/adhoc-sign.mjs) so macOS offers "Open Anyway" instead of "damaged".
afterPack: scripts/adhoc-sign.mjs
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  icon: resources/icon.png
  identity: null
dmg:
  # No spaces: the update feed (latest-mac.yml) and the GitHub asset use the same name.
  artifactName: Open-SQL-Tools-${version}-${arch}.${ext}
